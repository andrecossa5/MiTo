name: Release

# Publishes scmito to PyPI when a version tag is pushed.
# Authentication is via PyPI Trusted Publishing (OIDC) — no API token is stored.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # re-running the workflow for an already-published tag should be a
          # no-op rather than a hard failure
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release entry
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A tag alone does not show up under "Releases": create the entry, and
      # attach the built artifacts to it.
      - uses: softprops/action-gh-release@v2
        with:
          name: MiTo ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
