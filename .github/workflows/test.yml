name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, so breakage from a dependency release surfaces on its own rather
    # than inside an unrelated commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        # Run from a neutral directory so the installed package is exercised
        # rather than the source tree shadowing it.
        run: |
          mkdir -p /tmp/mito-tests
          cp -r tests /tmp/mito-tests/
          cd /tmp/mito-tests && pytest tests -v --cov=mito --cov-report=xml --cov-report=term-missing
          cp /tmp/mito-tests/coverage.xml "$GITHUB_WORKSPACE/" || true

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  legacy:
    # The 1.x maintenance branch, on the weekly canary only: scheduled workflows run
    # on the default branch, so this is how a dependency release that breaks 1.0.0
    # surfaces.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1.0.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: |
          mkdir -p /tmp/mito-tests
          cp -r tests /tmp/mito-tests/
          cd /tmp/mito-tests && pytest tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Verify the wheel installs and imports
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import mito; print(mito.__version__)"
